# Credential-free checks for untrusted pull requests and ordinary branch pushes.
name: Tests

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  credential-free:
    name: Credential-free quality and supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the untrusted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the frozen Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - name: Download reviewed module graph
        run: go mod download
      - name: Check formatting
        run: make fmt-check
      - name: Run vet
        run: make lint
      - name: Run unit, mock, and Protocol tests
        run: make test
      - name: Run race detector
        run: make test-race
      - name: Build
        run: make build
      - name: Check module graph
        run: make modules-check
      - name: Check generated docs and examples
        run: make docs-check
      - name: Validate workflow syntax
        run: make workflow-check
      - name: Inspect dependency licenses
        run: make licenses-check
      - name: Check reachable vulnerabilities
        run: make vulnerability-check
      - name: Scan tracked source for secrets
        run: make secrets-check
